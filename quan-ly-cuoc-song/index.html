<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1464f4">
<title>Quản Lý Cuộc Sống</title>
<style>
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --text: #1b2333;
  --muted: #6b7489;
  --line: #e3e7ef;
  --primary: #1464f4;
  --primary-soft: #e6eeff;
  --green: #12925a;
  --green-soft: #e2f6ec;
  --red: #d63c3c;
  --red-soft: #fde8e8;
  --orange: #d97a06;
  --orange-soft: #fff1dc;
  --shadow: 0 1px 3px rgba(20, 30, 60, .08);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151d;
    --card: #1a202b;
    --text: #e8ecf4;
    --muted: #97a0b4;
    --line: #2a3242;
    --primary: #5b93ff;
    --primary-soft: #1d2a45;
    --green: #3ccf8a;
    --green-soft: #15302a;
    --red: #ff6b6b;
    --red-soft: #3a1f23;
    --orange: #ffaa3d;
    --orange-soft: #3a2c17;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: 40px;
}
header {
  position: sticky; top: 0; z-index: 10;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px 4px; max-width: 1100px; margin: 0 auto; }
.top h1 { font-size: 18px; margin: 0; }
.top small { color: var(--muted); display: block; font-size: 12px; }
nav { display: flex; gap: 4px; overflow-x: auto; padding: 6px 12px 8px; max-width: 1100px; margin: 0 auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button {
  flex: none; border: 0; background: transparent; color: var(--muted);
  padding: 7px 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
}
nav button.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 14px 16px; }
h2 { font-size: 17px; margin: 18px 0 10px; }
h2:first-child { margin-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.card h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); margin-bottom: 12px; }
.cols { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.stat .lb { color: var(--muted); font-size: 12.5px; }
.stat .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
.stat .sub { color: var(--muted); font-size: 12.5px; }
.bar { height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.bar.green > i { background: var(--green); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1; min-width: 160px; }
.btn {
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: 7px 12px; border-radius: 9px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 9px; font-size: 13px; border-radius: 7px; }
.btn.danger { color: var(--red); }
.btn.zalo { color: #0068ff; border-color: #0068ff55; }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; }
.toolbar input, .toolbar select { width: auto; }
.toolbar .grow input { width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13.5px; cursor: pointer; }
.chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip b { font-weight: 600; opacity: .8; margin-left: 3px; }
.list { list-style: none; margin: 0; padding: 0; }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 2px; }
.item .body { flex: 1; min-width: 0; }
.item .title { font-weight: 600; overflow-wrap: anywhere; }
.item .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.item .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.item.done .title { text-decoration: line-through; color: var(--muted); }
.item input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--primary); }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.orange { background: var(--orange-soft); color: var(--orange); }
.tag.gray { background: var(--line); color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
.red-t { color: var(--red); }
.green-t { color: var(--green); }
.muted { color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
.chart { display: flex; align-items: flex-end; gap: 4px; height: 130px; padding-top: 16px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.chart .col i { width: 100%; max-width: 26px; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 2px; }
.chart .col span { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.chart .col em { font-size: 10.5px; font-style: normal; color: var(--text); margin-bottom: 2px; }
.sugg { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.sugg:first-of-type { border-top: 0; }
.sugg .ico { font-size: 18px; line-height: 1.3; }
.sugg .body { flex: 1; }
.hero { background: linear-gradient(135deg, #1464f4, #4f8cff); color: #fff; border: 0; }
.hero h3 { color: #fff; }
.hero .muted { color: #dbe6ff; }
.dots { display: flex; gap: 4px; }
.dot { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); font-size: 10.5px; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.dot.on { background: var(--green); border-color: var(--green); color: #fff; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.turn { border: 2px solid var(--green); }
.inline-select { width: auto; padding: 3px 6px; font-size: 13px; border-radius: 7px; }
#modal { position: fixed; inset: 0; background: rgba(10, 15, 30, .5); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; }
#modal[hidden] { display: none; }
.modal-box { background: var(--card); border-radius: 14px; padding: 16px; width: 100%; max-width: 560px; }
.modal-box h3 { margin: 0 0 12px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
.field.full { grid-column: 1 / -1; }
.row-end { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1b2333; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
#toast[hidden] { display: none; }
footer { max-width: 1100px; margin: 0 auto; padding: 0 16px; color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
@media (max-width: 560px) {
  .form { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr 1fr; }
  .stat .v { font-size: 19px; }
  .item { flex-wrap: wrap; }
  .item .acts { width: 100%; justify-content: flex-start; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>📋 Quản Lý Cuộc Sống</h1>
      <small id="today-label"></small>
    </div>
    <button class="btn sm primary" data-act="quickAdd">+ Việc nhanh</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<footer>
  <span>Dữ liệu được lưu trên trình duyệt của máy này.</span>
  <button class="btn sm" data-act="backup">⬇️ Sao lưu</button>
  <button class="btn sm" data-act="restore">⬆️ Khôi phục</button>
  <input type="file" id="restore-file" accept="application/json" hidden>
</footer>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';

// ===== Dữ liệu & lưu trữ =====
const KEY = 'quanlycuocsong_v1';
const DEFAULT = {
  tasks: [], ads: [], customers: [], staff: [], rrIndex: 0, teamTasks: [],
  finance: [], habits: [], goals: [], journal: []
};
let S = load();

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    return Object.assign(structuredClone(DEFAULT), d || {});
  } catch (e) {
    return structuredClone(DEFAULT);
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('⚠️ Không lưu được dữ liệu trên trình duyệt này'); }
}

// ===== Danh mục =====
const TABS = [
  ['tongquan', '🏠 Tổng quan'],
  ['congviec', '✅ Việc của anh'],
  ['quangcao', '📣 Quảng cáo'],
  ['khachhang', '🚗 Khách hàng'],
  ['doisale', '👥 Đội sale'],
  ['taichinh', '💰 Thu chi'],
  ['thoiquen', '💪 Thói quen'],
  ['muctieu', '🎯 Mục tiêu & Nhật ký']
];
const TASK_CATS = ['Quảng cáo', 'Đội sale', 'Bán xe', 'Cá nhân', 'Gia đình', 'Khác'];
const PRIORITY = [['cao', 'Cao'], ['tb', 'Trung bình'], ['thap', 'Thấp']];
const PLATFORMS = ['Facebook', 'TikTok', 'YouTube', 'Zalo'];
const CAR_MODELS = ['VF 3', 'VF 5', 'VF 6', 'VF 7', 'VF 8', 'VF 9', 'VF e34', 'Limo Green', 'Minio Green', 'Herio Green', 'Nerio Green', 'Chưa rõ'];
const SOURCES = ['Facebook Ads', 'Bot Facebook', 'Bot Zalo', 'Pancake', 'TikTok', 'YouTube', 'Giới thiệu', 'Khác'];
const CUST_STATUS = [['moi', 'Lead mới'], ['chamsoc', 'Đang chăm sóc'], ['coc', 'Đã đặt cọc'], ['giao', 'Đã giao xe'], ['huy', 'Thất bại']];
const TEAM_STATUS = [['todo', 'Chưa làm'], ['doing', 'Đang làm'], ['done', 'Xong']];
const INCOME_CATS = ['Hoa hồng bán xe', 'Lương', 'Thưởng', 'Khác'];
const EXPENSE_CATS = ['Quảng cáo', 'Ăn uống', 'Đi lại', 'Gia đình', 'Hóa đơn', 'Mua sắm', 'Sức khỏe', 'Khác'];
const MOODS = ['😄 Rất vui', '🙂 Vui', '😐 Bình thường', '😟 Buồn', '😫 Mệt'];
const GOAL_AREAS = ['Công việc', 'Tài chính', 'Sức khỏe', 'Gia đình', 'Bản thân'];

// ===== Tiện ích =====
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dstr = d => d.toLocaleDateString('sv-SE');
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
const thisMonth = () => today().slice(0, 7);
const money = n => (Number(n) || 0).toLocaleString('vi-VN') + 'đ';
const short = n => {
  n = Number(n) || 0;
  if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(1).replace('.0', '') + ' tỷ';
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1).replace('.0', '') + 'tr';
  if (Math.abs(n) >= 1e3) return Math.round(n / 1e3) + 'k';
  return String(n);
};
const fdate = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const label = (list, v) => (list.find(x => x[0] === v) || [, v])[1];
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const sum = (arr, k) => arr.reduce((t, x) => t + (Number(x[k]) || 0), 0);
const normPhone = p => {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('84') && d.length >= 11) d = '0' + d.slice(2);
  return d;
};
const staffName = id => (S.staff.find(s => s.id === id) || {}).name || 'Chưa giao';

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}

// Sao chép tin nhắn rồi mở Zalo của người nhận để dán và gửi
async function sendZalo(phone, text) {
  const ok = await copyText(text);
  toast(ok ? '📋 Đã sao chép tin nhắn – dán vào Zalo để gửi' : 'Không sao chép được, hãy gửi thủ công');
  const p = normPhone(phone);
  if (p) window.open('https://zalo.me/' + p, '_blank');
  else toast('Người này chưa có số điện thoại Zalo – tin nhắn đã được sao chép');
}

// ===== Chia việc theo lượt =====
const activeStaff = () => S.staff.filter(s => s.active !== false);
function peekTurn() {
  const list = activeStaff();
  return list.length ? list[S.rrIndex % list.length] : null;
}
function takeTurn() {
  const s = peekTurn();
  if (s) S.rrIndex = (S.rrIndex + 1) % activeStaff().length;
  return s;
}

// ===== Form dạng popup dùng chung =====
function fieldHtml(f, v) {
  v = v ?? f.def ?? '';
  const req = f.required ? 'required' : '';
  let input;
  if (f.type === 'select') {
    input = `<select name="${f.k}" ${req}>${f.options.map(o => {
      const [val, lab] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea name="${f.k}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  } else {
    const num = f.type === 'number' ? 'step="any" min="0" inputmode="decimal"' : '';
    input = `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" ${req} ${num} placeholder="${esc(f.ph || '')}">`;
  }
  return `<label class="field ${f.full ? 'full' : ''}"><span>${esc(f.label)}${f.required ? ' *' : ''}</span>${input}</label>`;
}

function openForm(title, fields, values, onSave) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-box"><h3>${esc(title)}</h3>
    <form class="form" id="mform">${fields.map(f => fieldHtml(f, values?.[f.k])).join('')}
      <div class="row-end"><button type="button" class="btn ghost" data-close>Hủy</button><button class="btn primary">Lưu</button></div>
    </form></div>`;
  m.hidden = false;
  m.querySelector('[data-close]').onclick = closeModal;
  const form = $('#mform');
  form.onsubmit = e => {
    e.preventDefault();
    const data = {};
    fields.forEach(f => {
      let v = form.elements[f.k].value.trim();
      if (f.type === 'number') v = v === '' ? 0 : Number(v);
      data[f.k] = v;
    });
    closeModal();
    onSave(data);
    save();
    render();
  };
  const first = form.querySelector('input, textarea, select');
  if (first) first.focus();
}
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// ===== Gợi ý công việc ngày mai =====
function suggestions() {
  const t = today(), tm = addDays(t, 1), out = [];
  const add = (ico, text, cat, pri = 'tb') => out.push({ ico, text, cat, pri });

  S.tasks.filter(x => !x.done && x.due && x.due < t)
    .forEach(x => add('⏰', `Xử lý việc quá hạn: ${x.title}`, x.cat, 'cao'));

  // Khách hàng
  const unassigned = S.customers.filter(c => !c.saleId && ['moi', 'chamsoc'].includes(c.status));
  if (unassigned.length) add('🔀', `Chia ${unassigned.length} lead chưa có sale phụ trách`, 'Đội sale', 'cao');
  const staleLeads = S.customers.filter(c => c.status === 'moi' && (c.createdAt || '').slice(0, 10) < t);
  if (staleLeads.length) add('📞', `Gọi lại ${staleLeads.length} lead mới chưa được chăm sóc (từ hôm qua trở về trước)`, 'Bán xe', 'cao');
  S.customers.filter(c => ['moi', 'chamsoc', 'coc'].includes(c.status) && c.nextFollow && c.nextFollow <= tm)
    .slice(0, 8)
    .forEach(c => add('🤝', `Chăm sóc khách ${c.name} (${c.model || 'chưa rõ xe'}) – ${staffName(c.saleId)}`, 'Bán xe'));
  S.customers.filter(c => c.status === 'coc' && c.deliveryDate && c.deliveryDate >= t && c.deliveryDate <= addDays(t, 3))
    .forEach(c => add('🚗', `Chuẩn bị giao xe ${c.model || ''} cho ${c.name} ngày ${fdate(c.deliveryDate)}`, 'Bán xe', 'cao'));
  const noDelivery = S.customers.filter(c => c.status === 'coc' && !c.deliveryDate);
  if (noDelivery.length) add('🗓️', `Chốt ngày giao xe cho ${noDelivery.length} khách đã đặt cọc`, 'Bán xe');

  // Đội sale
  activeStaff().forEach(s => {
    const late = S.teamTasks.filter(x => x.staffId === s.id && x.status !== 'done' && x.due && x.due < t);
    if (late.length) add('📣', `Nhắc ${s.name} hoàn thành ${late.length} việc quá hạn`, 'Đội sale', 'cao');
  });
  const pending = S.teamTasks.filter(x => x.status === 'todo' && x.due === tm);
  if (pending.length) add('👀', `Kiểm tra ${pending.length} việc của đội sale đến hạn ngày mai`, 'Đội sale');

  // Quảng cáo
  const adsToday = S.ads.filter(a => a.date === t);
  if (!adsToday.length) add('📊', 'Nhập số liệu quảng cáo hôm nay để theo dõi giá lead', 'Quảng cáo');
  const last7 = S.ads.filter(a => a.date < t && a.date >= addDays(t, -7));
  const cplToday = sum(adsToday, 'leads') ? sum(adsToday, 'spend') / sum(adsToday, 'leads') : 0;
  const cpl7 = sum(last7, 'leads') ? sum(last7, 'spend') / sum(last7, 'leads') : 0;
  if (cplToday && cpl7 && cplToday > cpl7 * 1.2)
    add('📈', `Giá lead hôm nay (${money(Math.round(cplToday))}) cao hơn trung bình 7 ngày ${pct(cplToday - cpl7, cpl7)}% – xem lại nội dung/đối tượng quảng cáo`, 'Quảng cáo', 'cao');
  const msgs = sum(adsToday, 'messages'), phones = sum(adsToday, 'phones');
  if (msgs >= 10 && pct(phones, msgs) < 20)
    add('🤖', `Bot chỉ lấy được SĐT ${pct(phones, msgs)}% số tin nhắn – tinh chỉnh kịch bản bot xin số`, 'Quảng cáo');
  if (S.ads.length && !S.ads.some(a => a.platform !== 'Facebook'))
    add('🚀', 'Lên kế hoạch thử kênh TikTok / YouTube (bắt đầu với 1 video giới thiệu xe)', 'Quảng cáo', 'thap');

  // Cá nhân
  const undone = S.habits.filter(h => !h.days?.[t]);
  if (undone.length) add('💪', `Duy trì thói quen: ${undone.map(h => h.name).join(', ')}`, 'Cá nhân', 'thap');
  S.goals.filter(g => g.deadline && g.deadline <= addDays(t, 14) && (g.progress || 0) < 80)
    .forEach(g => add('🎯', `Mục tiêu "${g.title}" sắp đến hạn (${fdate(g.deadline)}) mới đạt ${g.progress || 0}%`, 'Cá nhân'));
  const m = thisMonth(), fm = S.finance.filter(f => f.date.startsWith(m));
  const inc = sum(fm.filter(f => f.type === 'thu'), 'amount'), exp = sum(fm.filter(f => f.type === 'chi'), 'amount');
  if (exp > inc && inc > 0) add('💸', `Chi tiêu tháng này đang vượt thu nhập ${money(exp - inc)}`, 'Cá nhân');

  const rank = { cao: 0, tb: 1, thap: 2 };
  const planned = new Set(S.tasks.filter(x => x.due === tm).map(x => x.title));
  return out.filter(x => !planned.has(x.text)).sort((a, b) => rank[a.pri] - rank[b.pri]);
}

function adsSummary(rows) {

  r.cpl = r.leads ? Math.round(r.spend / r.leads) : 0;
  r.cpp = r.phones ? Math.round(r.spend / r.phones) : 0;
  return r;
}

}

VIEWS.taichinh = () => {
  const rows = S.finance.filter(f => f.date.startsWith(UI.finMonth)).sort((a, b) => b.date.localeCompare(a.date));
  const inc = rows.filter(f => f.type === 'thu'), exp = rows.filter(f => f.type === 'chi');
  const ti = sum(inc, 'amount'), te = sum(exp, 'amount');
  const byCat = {};
  exp.forEach(f => { byCat[f.cat] = (byCat[f.cat] || 0) + Number(f.amount); });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  return `<div class="toolbar"><h2 style="margin:0" class="grow">Thu chi</h2>
      <input type="month" value="${UI.finMonth}" data-ui="finMonth">
      <button class="btn" data-act="addFin" data-id="thu">+ Thu</button><button class="btn primary" data-act="addFin" data-id="chi">+ Chi</button></div>
    <div class="grid">
      <div class="stat"><div class="lb">Tổng thu</div><div class="v green-t">${money(ti)}</div></div>
      <div class="stat"><div class="lb">Tổng chi</div><div class="v red-t">${money(te)}</div></div>
      <div class="stat"><div class="lb">Còn lại</div><div class="v ${ti - te < 0 ? 'red-t' : ''}">${money(ti - te)}</div></div>
    </div>
    <div class="cols">
      <div class="card"><h3>Chi theo danh mục</h3>${cats.length ? cats.map(([c, v]) => `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${esc(c)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${pct(v, te)}%"></i></div></div>`).join('') : '<div class="empty">Chưa có khoản chi.</div>'}</div>
      <div class="card"><h3>Giao dịch</h3>${rows.length ? `<ul class="list">${rows.map(f => `<li class="item"><div class="body"><div class="title ${f.type === 'thu' ? 'green-t' : 'red-t'}">${f.type === 'thu' ? '+' : '−'}${money(f.amount)}</div>
        <div class="meta"><span>${fdate(f.date)}</span><span class="tag">${esc(f.cat)}</span>${f.note ? `<span>${esc(f.note)}</span>` : ''}</div></div>
        <div class="acts"><button class="btn sm" data-act="editFin" data-id="${f.id}">Sửa</button><button class="btn sm danger" data-act="delFin" data-id="${f.id}">Xóa</button></div></li>`).join('')}</ul>` : '<div class="empty">Chưa có giao dịch trong tháng.</div>'}</div>
    </div>`;
};

function streak(h) {
  let n = 0, d = today();
  if (!h.days?.[d]) d = addDays(d, -1);
  while (h.days?.[d]) { n++; d = addDays(d, -1); }
  return n;
}

    const s = suggestions()[Number(el.dataset.id)];

    const h = find('habits', el.dataset.id), d = el.dataset.day;
    h.days = h.days || {};
    if (h.days[d]) delete h.days[d]; else h.days[d] = true;
    save(); render();
  },
  sampleHabits: () => {
    ['Uống 2 lít nước', 'Tập thể dục 30 phút', 'Ngủ trước 23h', 'Đọc sách 15 phút'].forEach(name => S.habits.push({ id: uid(), name, days: {} }));
    save(); render();
  },

  addGoal: () => openForm('Thêm mục tiêu', goalFields(), {}, d => S.goals.push({ id: uid(), ...d, progress: Math.min(100, d.progress) })),
  editGoal: el => { const x = find('goals', el.dataset.id); openForm('Sửa mục tiêu', goalFields(), x, d => Object.assign(x, d, { progress: Math.min(100, d.progress) })); },
  delGoal: el => del('goals', el.dataset.id, 'mục tiêu'),
  goalStep: el => { const g = find('goals', el.dataset.id); g.progress = Math.max(0, Math.min(100, (g.progress || 0) + Number(el.dataset.v))); save(); render(); },

  addJournal: () => openForm('Nhật ký', journalFields(), {}, d => S.journal.push({ id: uid(), ...d })),
  editJournal: el => { const x = find('journal', el.dataset.id); openForm('Sửa nhật ký', journalFields(), x, d => Object.assign(x, d)); },
  delJournal: el => del('journal', el.dataset.id, 'nhật ký'),

  backup: () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `quan-ly-cuoc-song-${today()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  },
  restore: () => $('#restore-file').click()
};

function importCustomers(text, source, autoAssign) {
  const res = { added: 0, dup: 0, bad: 0 };
  const known = new Set(S.customers.map(c => normPhone(c.phone)).filter(Boolean));
  const modelKey = s => s.toLowerCase().replace(/\s+/g, '');
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const parts = line.split(/\t|,|;|\|/).map(s => s.trim()).filter(Boolean);
    const phoneIdx = parts.findIndex(p => /^(\+?84|0)\d{8,10}$/.test(p.replace(/[\s.\-()]/g, '')));
    if (phoneIdx < 0) { res.bad++; return; }
    const phone = normPhone(parts[phoneIdx]);
    if (known.has(phone)) { res.dup++; return; }
    known.add(phone);
    const rest = parts.filter((_, i) => i !== phoneIdx);
    const modelIdx = rest.findIndex(p => CAR_MODELS.some(m => modelKey(m) === modelKey(p)));
    const model = modelIdx >= 0 ? CAR_MODELS.find(m => modelKey(m) === modelKey(rest[modelIdx])) : 'Chưa rõ';
    const others = rest.filter((_, i) => i !== modelIdx);
    S.customers.push({
      id: uid(), name: others[0] || 'Khách ' + phone.slice(-4), phone, model, source, status: 'moi',
      saleId: autoAssign ? (takeTurn()?.id || '') : '', nextFollow: today(), deposit: 0, deliveryDate: '',
      note: others.slice(1).join(', '), createdAt: nowIso()
    });
    res.added++;
  });
  return res;
}

// ===== Sự kiện =====
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTS[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.chg === 'custStatus') {
    const c = find('customers', el.dataset.id);
    c.status = el.value;
    c.updatedAt = nowIso();
    save(); render();
    if (c.status === 'coc' && !c.deposit) ACTS.editCust({ dataset: { id: c.id } });
  } else if (el.dataset.chg === 'teamStatus') {
    const x = find('teamTasks', el.dataset.id);
    x.status = el.value;
    x.doneAt = x.status === 'done' ? nowIso() : '';
    logTeam(x, 'Trạng thái: ' + label(TEAM_STATUS, x.status));
    save(); render();
  } else if (el.dataset.ui && el.type !== 'search') {
    UI[el.dataset.ui] = el.value;
    render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ui === 'custSearch') {
    UI.custSearch = el.value;
    const pos = el.selectionStart;
    render();
    const again = document.querySelector('[data-ui="custSearch"]');
    again.focus();
    again.setSelectionRange(pos, pos);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
$('#restore-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (typeof d !== 'object' || !Array.isArray(d.tasks)) throw new Error('bad');
    if (!confirm('Khôi phục sẽ thay thế toàn bộ dữ liệu hiện tại. Tiếp tục?')) return;
    S = Object.assign(structuredClone(DEFAULT), d);
    save(); render(); toast('Đã khôi phục dữ liệu');
  } catch (err) {
    toast('File sao lưu không hợp lệ');
  } finally {
    e.target.value = '';
  }
});

// ===== Hiển thị =====
function render() {
  $('#today-label').textContent = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'numeric', year: 'numeric' });
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="${UI.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${l}</button>`).join('');
  $('#view').innerHTML = VIEWS[UI.tab]();
  try { localStorage.setItem(KEY + '_tab', UI.tab); } catch (e) { /* bỏ qua */ }
}
ACTS.tab = el => { UI.tab = el.dataset.v; render(); window.scrollTo(0, 0); };
try { const saved = localStorage.getItem(KEY + '_tab'); if (VIEWS[saved]) UI.tab = saved; } catch (e) { /* bỏ qua */ }
render();
</script>
